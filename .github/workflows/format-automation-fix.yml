name: format-automation-fix

on:
  pull_request:
    paths:
      - .github/workflows/format-automation-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Format the automation scripts
        run: |
          uv run ruff format scripts/web_night_shift.py scripts/nb_web
          uv run ruff check scripts/web_night_shift.py scripts/nb_web
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/web_night_shift.py scripts/nb_web
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format unattended automation"
          git push origin "HEAD:${{ github.head_ref }}"
