name: inspect-bootstrap-run

on:
  pull_request:
    paths:
      - .github/workflows/inspect-bootstrap-run.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect the latest bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
            --jq '[.workflow_runs[] | select(.name == "bootstrap-first-edition")] | sort_by(.id) | reverse | .[0].id // empty')
          if [ -z "$run_id" ]; then
            echo "No bootstrap-first-edition run found." > /tmp/bootstrap.md
          else
            {
              echo "## Bootstrap run $run_id"
              echo
              echo '```text'
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '[.id, .status, (.conclusion // "-"), .event, .head_sha, .html_url] | @tsv'
              echo
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                --jq '.jobs[] | [.id, .name, .status, (.conclusion // "-")] | @tsv'
              echo '```'
              echo
              echo '## Failed log'
              echo '```text'
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 220 || true
              echo '```'
            } > /tmp/bootstrap.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/bootstrap.md
