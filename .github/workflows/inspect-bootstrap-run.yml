name: inspect-bootstrap-run

on:
  pull_request:
    paths:
      - .github/workflows/inspect-bootstrap-run.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Wait for and inspect the canonical-URL bootstrap run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          target_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.name == \"bootstrap-first-edition\" and .head_sha == \"$target_sha\")] | sort_by(.id) | reverse | .[0].id // empty")
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "No bootstrap run found for $target_sha." > /tmp/bootstrap.md
          else
            for _ in $(seq 1 120); do
              status=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" --jq .status)
              if [ "$status" = "completed" ]; then break; fi
              sleep 10
            done
            {
              echo "## Bootstrap run $run_id"
              echo
              echo '```text'
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '[.id, .status, (.conclusion // "-"), .event, .head_sha, .html_url] | @tsv'
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" \
                --jq '.jobs[] | [.id, .name, .status, (.conclusion // "-")] | @tsv'
              echo '```'
              echo
              echo '## Article pull requests'
              echo '```text'
              gh pr list --repo "$GITHUB_REPOSITORY" --state all \
                --search 'in:title "nb: the-one/"' --limit 10 \
                --json number,state,mergedAt,title,url \
                --jq '.[] | [.number, .state, (.mergedAt // "-"), .title, .url] | @tsv'
              echo '```'
              echo
              echo '## Failed log'
              echo '```text'
              gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 200 || true
              echo '```'
            } > /tmp/bootstrap.md
          fi
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/bootstrap.md
