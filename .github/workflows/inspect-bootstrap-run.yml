name: inspect-bootstrap-run

on:
  pull_request:
    paths:
      - .github/workflows/inspect-bootstrap-run.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Extract the publication-step failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=30069489060
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          {
            echo "## Publication-step failure from run $run_id"
            echo
            echo '```text'
            grep -E -C 5 'error:|fatal:|failed|BLOCK:|WARN:|verdict:|Process completed|pull request|already exists|Resource not accessible|HTTP 4|exit code' /tmp/failed.log | tail -n 120 || true
            echo '```'
            echo
            echo '## Final 80 log lines'
            echo '```text'
            tail -n 80 /tmp/failed.log
            echo '```'
          } > /tmp/bootstrap.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/bootstrap.md
