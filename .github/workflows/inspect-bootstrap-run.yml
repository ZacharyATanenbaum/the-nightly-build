name: inspect-bootstrap-run

on:
  pull_request:
    paths:
      - .github/workflows/inspect-bootstrap-run.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate the canonical-URL publication failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=30069879715
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/failed.log 2>&1 || true
          {
            echo "## Canonical-URL publication failure from run $run_id"
            echo
            echo '```text'
            grep -E -C 5 'error:|fatal:|BLOCK:|WARN:|verdict:|Process completed|already exists|Resource not accessible|HTTP 4|exit code|not permitted|failed' /tmp/failed.log | tail -n 120 || true
            echo '```'
            echo
            echo '## Final 60 log lines'
            echo '```text'
            tail -n 60 /tmp/failed.log
            echo '```'
          } > /tmp/bootstrap.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/bootstrap.md
