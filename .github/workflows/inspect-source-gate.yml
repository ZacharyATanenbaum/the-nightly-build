name: inspect-source-gate

on:
  pull_request:
    paths:
      - .github/workflows/inspect-source-gate.yml

permissions:
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout published library
        uses: actions/checkout@v4
        with:
          ref: library
          path: library-checkout

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Rebuild commissioning clusters
        id: prepare
        run: uv run scripts/web_night_shift.py prepare --library library-checkout

      - name: Post clusters
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Current commissioning clusters'
            echo
            echo 'Prepare result: `${{ steps.prepare.outputs.reason }}`'
            echo
            echo '```json'
            head -c 50000 .nb-web/candidates.json
            echo
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md
