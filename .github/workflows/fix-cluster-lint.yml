name: fix-cluster-lint

on:
  pull_request:
    paths:
      - .github/workflows/fix-cluster-lint.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Apply Ruff's safe fixes
        run: |
          uv run ruff check scripts/nb_web/collect.py scripts/nb_web/cluster.py tests/test_web_clusters.py --fix
          uv run ruff format scripts/nb_web/collect.py scripts/nb_web/cluster.py tests/test_web_clusters.py
          uv run ruff check scripts/nb_web/collect.py scripts/nb_web/cluster.py tests/test_web_clusters.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nb_web tests/test_web_clusters.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: satisfy cluster lint"
          git push origin "HEAD:${{ github.head_ref }}"
