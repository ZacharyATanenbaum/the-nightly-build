name: format-pr142-temp

on:
  push:
    branches: [integration/format-pr142-pages]

permissions:
  contents: write

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip format]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/format-pr142-pages
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --write WEB_TASK.md docs/scheduling.md .github/workflows/publish.yml
      - name: Commit formatted files
        run: |
          git config user.name "The Nightly Build"
          git config user.email "nightly-build@users.noreply.github.com"
          git add WEB_TASK.md docs/scheduling.md .github/workflows/publish.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply repository Prettier [skip format]"
          git push origin HEAD:integration/format-pr142-pages
