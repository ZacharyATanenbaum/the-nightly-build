name: web-run-status

on:
  workflow_run:
    workflows: [nightly-build-check, web-publish]
    types: [completed]

permissions:
  actions: read
  contents: write
  pull-requests: read

concurrency:
  group: web-run-status
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the status branch
        uses: actions/checkout@v4
        with:
          ref: automation-status
          fetch-depth: 0

      - name: Update the durable status file
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          mkdir -p status

          published_sha=$(git ls-remote origin refs/heads/gh-pages | awk '{print $1}')
          if [ -n "$published_sha" ]; then
            site_url="https://raw.githack.com/${GITHUB_REPOSITORY}/${published_sha}/index.html"
          else
            site_url="not published yet"
          fi

          article_url=$(gh pr list --repo "$GITHUB_REPOSITORY" --state all \
            --search 'in:title "nb: the-one/"' --limit 20 \
            --json number,url --jq 'sort_by(.number) | reverse | .[0].url // "none"')

          status_file="status/${RUN_NAME}.md"
          {
            echo "# Automation status: $RUN_NAME"
            echo
            echo "- Conclusion: **$RUN_CONCLUSION**"
            echo "- Trigger: \`$RUN_EVENT\`"
            echo "- Commit: \`$RUN_SHA\`"
            echo "- Run ID: \`$RUN_ID\`"
            echo "- Run: $RUN_URL"
            echo "- Latest article PR: $article_url"
            echo "- Published site: $site_url"
            echo
            echo "Updated by the trusted workflow-run reporter."
          } > "$status_file"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$status_file"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "status: $RUN_NAME $RUN_CONCLUSION"
          git push origin HEAD:automation-status
