name: web-run-status

on:
  workflow_run:
    workflows: [web-night-shift, web-publish]
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Update the automation status issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          title="Automation status: $RUN_NAME"
          {
            echo "## Latest run"
            echo
            echo "- Conclusion: **$RUN_CONCLUSION**"
            echo "- Trigger: \`$RUN_EVENT\`"
            echo "- Commit: \`$RUN_SHA\`"
            echo "- Run: $RUN_URL"
            echo "- Site: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
            echo
            echo "This issue is updated in place after every completed run."
          } > /tmp/status.md

          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" --state all \
            --search "\"$title\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -n 1)
          if [ -z "$issue" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
              --body-file /tmp/status.md
          else
            gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" \
              --title "$title" --body-file /tmp/status.md
          fi
