name: verify-github-pages

on:
  pull_request:
    paths:
      - .github/workflows/verify-github-pages.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pages API and public URLs
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_URL: https://zacharyatanenbaum.github.io/the-nightly-build/
          ARTICLE_URL: https://zacharyatanenbaum.github.io/the-nightly-build/library/the-one/jodrell-bank-flat-budget-capability-collapse.html
        run: |
          set -euo pipefail

          echo '=== GitHub Pages API ==='
          api_status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $api_status"
          cat /tmp/pages.json
          echo

          probe() {
            name=$1
            url=$2
            output=$3
            status=$(curl -L --retry 6 --retry-delay 5 --connect-timeout 15 \
              -sS -o "$output" -w '%{http_code}' "$url")
            echo "$name status: $status"
            echo "$name final URL: $(curl -L --retry 3 --connect-timeout 15 -sS -o /dev/null -w '%{url_effective}' "$url")"
            echo "$name title: $(grep -o '<title>[^<]*</title>' "$output" | head -n 1 || true)"
            if [ "$status" != 200 ]; then
              echo "$name response body:"
              head -c 2000 "$output" || true
              echo
              return 1
            fi
          }

          echo '=== Public homepage ==='
          probe HOME "$HOME_URL" /tmp/home.html

          echo '=== Public article ==='
          probe ARTICLE "$ARTICLE_URL" /tmp/article.html
          grep -q '"slug": "jodrell-bank-flat-budget-capability-collapse"' /tmp/article.html
          echo 'Article metadata marker found.'
