name: verify-github-pages

on:
  pull_request:
    paths:
      - .github/workflows/verify-github-pages.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Pages API and public URLs
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_URL: https://zacharyatanenbaum.github.io/the-nightly-build/
          ARTICLE_URL: https://zacharyatanenbaum.github.io/the-nightly-build/library/the-one/jodrell-bank-flat-budget-capability-collapse.html
        run: |
          set -euo pipefail

          for attempt in $(seq 1 20); do
            echo "=== Attempt $attempt ==="

            api_status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
            home_status=$(curl -L --connect-timeout 15 -sS -o /tmp/home.html -w '%{http_code}' "$HOME_URL")
            article_status=$(curl -L --connect-timeout 15 -sS -o /tmp/article.html -w '%{http_code}' "$ARTICLE_URL")

            echo "Pages API status: $api_status"
            echo "Homepage status: $home_status"
            echo "Article status: $article_status"

            if [ "$api_status" = 200 ] \
              && [ "$home_status" = 200 ] \
              && [ "$article_status" = 200 ] \
              && grep -q '"slug": "jodrell-bank-flat-budget-capability-collapse"' /tmp/article.html; then
              echo "Homepage title: $(grep -o '<title>[^<]*</title>' /tmp/home.html | head -n 1 || true)"
              echo "Article title: $(grep -o '<title>[^<]*</title>' /tmp/article.html | head -n 1 || true)"
              echo 'Article metadata marker found.'
              cat /tmp/pages.json
              exit 0
            fi

            sleep 15
          done

          echo '=== Final Pages API response ==='
          cat /tmp/pages.json || true
          echo
          echo '=== Final homepage response ==='
          head -c 2000 /tmp/home.html || true
          echo
          echo '=== Final article response ==='
          head -c 2000 /tmp/article.html || true
          echo
          exit 1
