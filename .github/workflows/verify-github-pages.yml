name: verify-github-pages

on:
  pull_request:
    paths:
      - .github/workflows/verify-github-pages.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect publisher and Pages state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          echo '=== Recent web-publish runs ==='
          gh run list --repo "$GITHUB_REPOSITORY" --workflow web-publish.yml --limit 5 \
            --json databaseId,status,conclusion,event,headSha,createdAt,url

          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-publish.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          echo "Latest publisher run: $run_id"

          echo '=== Publisher jobs ==='
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion,url,jobs

          echo '=== Failed publisher log ==='
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed || true

          echo '=== GitHub Pages API ==='
          curl -sS -D /tmp/pages.headers -o /tmp/pages.json \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages" || true
          cat /tmp/pages.headers
          cat /tmp/pages.json
