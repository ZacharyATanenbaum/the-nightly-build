name: verify-github-pages

on:
  pull_request:
    paths:
      - .github/workflows/verify-github-pages.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Pages API and public URLs
        env:
          GH_TOKEN: ${{ github.token }}
          HOME_URL: https://zacharyatanenbaum.github.io/the-nightly-build/
          ARTICLE_URL: https://zacharyatanenbaum.github.io/the-nightly-build/library/the-one/jodrell-bank-flat-budget-capability-collapse.html
        run: |
          set -euo pipefail

          api_status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          home_status=$(curl -L -sS -o /tmp/home.html -w '%{http_code}' "$HOME_URL")
          article_status=$(curl -L -sS -o /tmp/article.html -w '%{http_code}' "$ARTICLE_URL")

          echo "Pages API status: $api_status"
          echo "Homepage status: $home_status"
          echo "Article status: $article_status"
          echo "Homepage title: $(grep -o '<title>[^<]*</title>' /tmp/home.html | head -n 1 || true)"
          echo "Article title: $(grep -o '<title>[^<]*</title>' /tmp/article.html | head -n 1 || true)"
          cat /tmp/pages.json

          test "$api_status" = 200
          test "$home_status" = 200
          test "$article_status" = 200
          grep -q 'jodrell-bank-flat-budget-capability-collapse' /tmp/article.html
