name: verify-github-pages

on:
  pull_request:
    paths:
      - .github/workflows/verify-github-pages.yml

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Isolate configure-pages failure
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow web-publish.yml --limit 1 \
            --json databaseId --jq '.[0].databaseId')
          echo "Publisher run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 80
