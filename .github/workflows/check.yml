# Integration copy of the article validator for an isolated historical branch.
name: nightly-build-check

on:
  pull_request:
    branches: [integration/closure-base-20260727]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      autopublish: ${{ steps.proof.outputs.autopublish }}
    steps:
      - name: Checkout PR head (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout engine from main (never trust engine code from the PR)
        uses: actions/checkout@v4
        with:
          ref: main
          path: _main

      - name: Checkout published library state (base)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: _library

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Write PR body to file
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > /tmp/pr-body.txt

      - name: Run the proof
        id: proof
        run: |
          set +e
          uv run --with websocket-client _main/engine/check.py --pr \
            --repo . --main _main \
            --base "origin/${{ github.base_ref }}" \
            --head "HEAD" \
            --library _library \
            --pr-body /tmp/pr-body.txt > /tmp/proof.txt
          code=$?
          cat /tmp/proof.txt
          echo "autopublish=$(uv run _main/engine/ci_helpers.py autopublish --repo _main --diff-base origin/${{ github.base_ref }})" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Render probe
        run: |
          path=$(uv run _main/engine/ci_helpers.py article-path --diff-base "origin/${{ github.base_ref }}")
          uv run _main/engine/build_site.py --repo _main --library . --out /tmp/site
          uv run --with websocket-client _main/engine/render_check.py --site /tmp/site --article "$path" | tee -a /tmp/proof.txt

      - name: Comment findings on the PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## The editor'
            echo '```'
            cat /tmp/proof.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment ${{ github.event.pull_request.number }} --body-file /tmp/comment.md || true

  automerge:
    needs: validate
    if: needs.validate.outputs.autopublish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge validated integration article
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}
