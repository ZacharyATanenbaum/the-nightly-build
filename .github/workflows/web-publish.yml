# This trusted workflow publishes the current library and reports through web-run-status.
name: web-publish

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/web-publish.yml

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout engine and press
        uses: actions/checkout@v4

      - name: Checkout published library
        uses: actions/checkout@v4
        with:
          ref: library
          path: library-checkout

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build the site
        run: |
          uv run engine/build_site.py \
            --repo . --library library-checkout --out site \
            --base-url "${{ steps.pages.outputs.base_url }}" \
            --repository "${{ github.repository }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
