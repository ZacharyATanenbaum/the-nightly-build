# Trusted publisher for GitHub Pages.
# Article generation belongs to the ChatGPT Scheduled Task. This workflow runs
# only after the repository's independent article validator has completed, or
# when the publisher itself is changed on main.
name: web-publish

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: [nightly-build-check]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/web-publish.yml

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine and press
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Checkout published library
        uses: actions/checkout@v6
        with:
          ref: library
          path: library-checkout

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build the site
        run: |
          set -euo pipefail
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          repo=${GITHUB_REPOSITORY#*/}
          public_base="https://${owner}.github.io/${repo}/"
          uv run engine/build_site.py \
            --repo . --library library-checkout --out site \
            --base-url "$public_base" \
            --repository "$GITHUB_REPOSITORY"
          touch site/.nojekyll

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
