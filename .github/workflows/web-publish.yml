# This trusted workflow builds the current library and publishes a static branch.
# A merged article is present; changing this file retriggers the immutable first-edition build.
name: web-publish

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/web-publish.yml

permissions:
  contents: write

concurrency:
  group: web-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout engine and press
        uses: actions/checkout@v4

      - name: Checkout published library
        uses: actions/checkout@v4
        with:
          ref: library
          path: library-checkout

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Build the site
        env:
          PUBLIC_BASE: https://raw.githack.com/${{ github.repository }}/gh-pages/
        run: |
          uv run engine/build_site.py \
            --repo . --library library-checkout --out site \
            --base-url "$PUBLIC_BASE" \
            --repository "${{ github.repository }}"
          touch site/.nojekyll

      - name: Publish the static branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git -C site init
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site checkout -b gh-pages
          git -C site add -A
          git -C site commit -m "publish: ${GITHUB_SHA}"
          git -C site remote add origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C site push --force origin HEAD:gh-pages
          published_sha=$(git -C site rev-parse HEAD)
          {
            echo "Published commit: $published_sha"
            echo
            echo "Site: https://raw.githack.com/${GITHUB_REPOSITORY}/${published_sha}/index.html"
          } >> "$GITHUB_STEP_SUMMARY"
