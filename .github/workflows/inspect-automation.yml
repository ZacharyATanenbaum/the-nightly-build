name: inspect-automation

on:
  pull_request:
    paths:
      - .github/workflows/inspect-automation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply the final wiring and remove this helper
        run: |
          set -euo pipefail
          sed -i \
            -e 's#candidates: .nb-web/candidates.json#candidates: .nb-web/candidates-prompt.json#' \
            -e 's#recent: .nb-web/recent.json#recent: .nb-web/recent-prompt.json#' \
            .github/workflows/web-night-shift.yml
          sed -i \
            's#"model": "openai/gpt-5-mini"#"model": "openai/gpt-4.1"#' \
            scripts/nb_web/article.py
          rm .github/workflows/inspect-automation.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: complete unattended publication wiring"
          git push origin "HEAD:${{ github.head_ref }}"
