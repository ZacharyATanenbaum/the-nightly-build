name: inspect-automation

on:
  pull_request:
    paths:
      - .github/workflows/inspect-automation.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recent workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Recent workflow runs'
            echo
            echo '```text'
            gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=30" \
              --jq '.workflow_runs[] | [.id, .name, .event, .status, (.conclusion // "-"), .head_sha, .html_url] | @tsv'
            echo '```'
            echo
            echo '## Recent jobs'
            echo
            echo '```text'
            for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=12" --jq '.workflow_runs[].id'); do
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=100" \
                --jq ".jobs[] | [\"run=$id\", .id, .name, .status, (.conclusion // \"-\")] | @tsv"
            done
            echo '```'
          } > /tmp/automation.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/automation.md
