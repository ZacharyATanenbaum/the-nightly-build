name: inspect-automation

on:
  pull_request:
    paths:
      - .github/workflows/inspect-automation.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Route bounded prompt inputs and correct model metadata
        run: |
          set -euo pipefail
          sed -i \
            -e 's#WORK / "candidates.json"#WORK / "candidates-full.json"#' \
            -e 's#WORK / "candidates-prompt.json"#WORK / "candidates.json"#' \
            -e 's#WORK / "recent.json"#WORK / "recent-full.json"#' \
            -e 's#WORK / "recent-prompt.json"#WORK / "recent.json"#' \
            scripts/nb_web/collect.py
          sed -i \
            's#WORK / "candidates.json"#WORK / "candidates-full.json"#' \
            scripts/nb_web/research.py
          sed -i \
            's#"model": "openai/gpt-5-mini"#"model": "openai/gpt-4.1"#' \
            scripts/nb_web/article.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nb_web
          git commit -m "fix: route bounded model inputs"
          git push origin "HEAD:${{ github.head_ref }}"
