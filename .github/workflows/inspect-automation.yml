name: inspect-automation

on:
  pull_request:
    paths:
      - .github/workflows/inspect-automation.yml

permissions:
  actions: read
  contents: read
  pull-requests: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect recent workflow failures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Failed unattended workflow logs'
            for id in 30059523020 30059522964 30059546708; do
              echo
              echo "### Run $id"
              echo '```text'
              gh run view "$id" --repo "$GITHUB_REPOSITORY" --log-failed 2>&1 | tail -n 160
              echo '```'
            done
          } > /tmp/automation.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/automation.md
