name: format-url-normalization

on:
  pull_request:
    paths:
      - .github/workflows/format-url-normalization.yml
      - scripts/nb_web/common.py
      - tests/test_web_urls.py

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Format and commit URL normalization
        run: |
          uv run ruff format scripts/nb_web/common.py tests/test_web_urls.py
          uv run ruff check scripts/nb_web/common.py tests/test_web_urls.py
          uv run pytest tests/test_web_urls.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nb_web/common.py tests/test_web_urls.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: format URL normalization"
          git push origin "HEAD:${{ github.head_ref }}"
