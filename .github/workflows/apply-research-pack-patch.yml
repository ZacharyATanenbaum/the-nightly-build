name: apply-research-pack-patch

on:
  pull_request:
    paths:
      - .github/workflows/apply-research-pack-patch.yml
      - scripts/apply_research_pack_patch.py
      - press/series/the-one/bootstrap-selection.json

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Apply and validate the bounded research pack
        run: |
          set -euo pipefail
          python scripts/apply_research_pack_patch.py
          uv sync --group figure-capture --group charts
          uv run ruff format scripts/nb_web/research.py tests/test_web_research_pack.py
          uv run ruff check scripts/nb_web/research.py tests/test_web_research_pack.py
          uv run ty check
          uv run pytest tests/test_web_research_pack.py tests/test_web_source_identity.py tests/test_web_clusters.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nb_web/research.py tests/test_web_research_pack.py
          git add -A scripts/apply_research_pack_patch.py
          git commit -m "fix: bound the model research pack"
          git push origin "HEAD:${{ github.head_ref }}"
