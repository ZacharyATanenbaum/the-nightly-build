name: apply-source-identity-patch

on:
  pull_request:
    paths:
      - .github/workflows/apply-source-identity-patch.yml

permissions:
  contents: write
  pull-requests: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Apply the source identity patch
        run: python scripts/apply_source_identity_patch.py

      - name: Lock and validate the changed system
        id: validate
        run: |
          set +e
          : > /tmp/source-identity-validation.txt
          failed=0
          run_check() {
            echo >> /tmp/source-identity-validation.txt
            echo "$ $*" >> /tmp/source-identity-validation.txt
            "$@" >> /tmp/source-identity-validation.txt 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then
              echo "FAILED ($code)" >> /tmp/source-identity-validation.txt
              failed=1
            fi
          }
          run_check uv lock
          run_check uv sync --group figure-capture --group charts
          run_check uv run ruff format \
            scripts/nb_web/common.py scripts/nb_web/research.py \
            scripts/nb_web/article.py scripts/nb_web/artifacts.py \
            scripts/nb_web/cluster.py tests/test_web_source_identity.py
          run_check uv run ruff check \
            scripts/nb_web/common.py scripts/nb_web/research.py \
            scripts/nb_web/article.py scripts/nb_web/artifacts.py \
            scripts/nb_web/cluster.py tests/test_web_source_identity.py
          run_check uv run ty check
          run_check uv run pytest tests/test_web_source_identity.py tests/test_web_clusters.py
          run_check uv run engine/validate_config.py --repo .
          if [ "$failed" -eq 0 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Post validation diagnostics
        if: steps.validate.outputs.ok != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Source identity validation'
            echo '```text'
            head -c 50000 /tmp/source-identity-validation.txt
            echo
            echo '```'
          } > /tmp/comment.md
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "$GITHUB_REPOSITORY" --body-file /tmp/comment.md

      - name: Commit the validated patch
        if: steps.validate.outputs.ok == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add WEB_TASK.md pyproject.toml uv.lock
          git add .github/prompts
          git add press/series/the-one/series.yaml
          git add scripts/nb_web tests/test_web_source_identity.py
          git add -A scripts/apply_source_identity_patch.py
          git commit -m "fix: preserve genuine primary-source evidence"
          git push origin "HEAD:${{ github.head_ref }}"
