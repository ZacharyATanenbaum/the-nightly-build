name: finalize-render-probe-formatting

on:
  push:
    branches: [fix/render-probe-http]

permissions:
  contents: write

jobs:
  format-and-remove-self:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --group figure-capture --group charts
      - name: Apply canonical formatters
        run: |
          npx prettier --write .github/workflows/check.yml WEB_TASK.md
          uv run ruff check --fix engine/render_check.py tests/test_render_check.py || true
          uv run ruff format engine/render_check.py tests/test_render_check.py
          rm -rf .diagnostics
          rm .github/workflows/diagnose-render-probe.yml
      - name: Commit formatter output and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply canonical formatter output" || exit 0
          git push
