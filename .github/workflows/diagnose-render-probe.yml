name: diagnose-render-probe

on:
  push:
    branches: [fix/render-probe-http]

permissions:
  contents: read
  pull-requests: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --group figure-capture --group charts
      - name: Capture diagnostics
        run: |
          set +e
          npx prettier --check . > prettier.txt 2>&1
          echo $? > prettier.exit
          uv run ruff check . > ruff.txt 2>&1
          echo $? > ruff.exit
          uv run ruff format --check . > ruff-format.txt 2>&1
          echo $? > ruff-format.exit
          uv run pytest tests/test_render_check.py > pytest.txt 2>&1
          echo $? > pytest.exit
          exit 0
      - name: Comment diagnostics
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Current render-probe diagnostics'
            for name in prettier ruff ruff-format pytest; do
              echo
              echo "### $name (exit $(cat $name.exit))"
              echo '```text'
              cat "$name.txt"
              echo '```'
            done
          } > /tmp/diagnostics.md
          gh pr comment 26 --repo "$GITHUB_REPOSITORY" --body-file /tmp/diagnostics.md
