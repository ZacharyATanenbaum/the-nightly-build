name: diagnose-render-probe

on:
  push:
    branches: [fix/render-probe-http]

permissions:
  contents: write

jobs:
  format:
    if: github.event.head_commit.message != 'chore: apply render probe formatter output'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --group figure-capture --group charts
      - name: Format and test
        run: |
          npx prettier --write .github/workflows/check.yml WEB_TASK.md
          uv run ruff check --fix engine/render_check.py tests/test_render_check.py
          uv run ruff format engine/render_check.py tests/test_render_check.py
          uv run pytest tests/test_render_check.py
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/check.yml WEB_TASK.md engine/render_check.py tests/test_render_check.py
          git commit -m "chore: apply render probe formatter output" || exit 0
          git push
