name: diagnose-render-probe

on:
  push:
    branches: [fix/render-probe-http]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: npm ci
      - run: uv sync --group figure-capture --group charts
      - name: Capture diagnostics
        run: |
          set +e
          npx prettier --check . > prettier.txt 2>&1
          echo $? > prettier.exit
          uv run ruff check . > ruff.txt 2>&1
          echo $? > ruff.exit
          uv run ruff format --check . > ruff-format.txt 2>&1
          echo $? > ruff-format.exit
          uv run pytest tests/test_render_check.py > pytest.txt 2>&1
          echo $? > pytest.exit
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: render-probe-diagnostics
          path: |
            prettier.txt
            prettier.exit
            ruff.txt
            ruff.exit
            ruff-format.txt
            ruff-format.exit
            pytest.txt
            pytest.exit
