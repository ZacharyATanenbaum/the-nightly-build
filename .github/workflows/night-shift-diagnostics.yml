name: night-shift-diagnostics

on:
  pull_request:
    paths:
      - scripts/web_night_shift.py
      - scripts/nb_web/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Remove obsolete suppressions and verify types
        run: |
          sed -i '1{/^# ty: ignore$/d;}' \
            scripts/nb_web/article.py scripts/nb_web/artifacts.py
          uv run ty check scripts/web_night_shift.py scripts/nb_web

      - name: Commit the type fix
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/nb_web/article.py scripts/nb_web/artifacts.py
          git commit -m "fix: remove obsolete type suppressions"
          git push origin "HEAD:${{ github.head_ref }}"
