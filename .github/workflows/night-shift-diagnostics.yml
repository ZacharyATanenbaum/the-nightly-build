name: night-shift-diagnostics

on:
  pull_request:
    paths:
      - scripts/web_night_shift.py
      - scripts/nb_web/**

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Apply Ruff fixes and formatting
        run: |
          uv run ruff check scripts/web_night_shift.py scripts/nb_web --fix --unsafe-fixes
          uv run ruff format scripts/web_night_shift.py scripts/nb_web
          uv run ruff check scripts/web_night_shift.py scripts/nb_web
          uv run ruff format --check scripts/web_night_shift.py scripts/nb_web

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/web_night_shift.py scripts/nb_web
          git commit -m "style: format repository night shift"
          git push origin "HEAD:${{ github.head_ref }}"
