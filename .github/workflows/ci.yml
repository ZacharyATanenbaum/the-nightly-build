# Temporary exact-diff validation workflow for upstream PR 142.
name: CI

on:
  pull_request:
    branches: [integration/upstream-pr142-base]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-upstream-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt-scheduled-tasks
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply repository Prettier output
        run: npx prettier --write AGENTS.md WEB_TASK.md assets/chatgpt-scheduled-task-architecture.svg docs/harnesses.md docs/scheduling.md
      - name: Commit formatter output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md WEB_TASK.md assets/chatgpt-scheduled-task-architecture.svg docs/harnesses.md docs/scheduling.md
          git commit -m "chore: apply upstream PR formatter output" || exit 0
          git push origin HEAD:agent/chatgpt-scheduled-tasks

  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --group figure-capture --group charts
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      - run: uv run pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx prettier --check .
      - run: npx eslint .
      - run: npx stylelint "engine/assets/**/*.css" "templates/**/*.css"
      - run: npx markdownlint-cli2
      - run: npm run lint:sg
      - run: npm run test:js

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck (preinstalled on ubuntu runners)
        run: shellcheck setup.sh scripts/setup.sh scripts/sync.sh
      - name: shfmt
        run: |
          curl -fsSL https://github.com/mvdan/sh/releases/download/v3.10.0/shfmt_v3.10.0_linux_amd64 -o /tmp/shfmt
          chmod +x /tmp/shfmt
          /tmp/shfmt -d setup.sh scripts/setup.sh scripts/sync.sh
