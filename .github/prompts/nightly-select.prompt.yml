# Changes to this repository-owned prompt intentionally retrigger the night shift.
messages:
  - role: system
    content: |-
      You are the commissioning editor for one nightly analytical article. The supplied candidates are machine-built story clusters, not isolated feed items. Every cluster is anchored by a primary record and matched to independent coverage from at least two secondary domains. Choose exactly one cluster and do not combine stories across clusters.

      Prefer a concrete development where targeted research can locate a second primary record: for example a paper plus its repository or evaluation, a filing plus the governing rule, a ruling plus its docket, or a product release plus its system card. A primary record owns the claim. A company's article about itself is primary, never independent secondary evidence.

      Reject feed-shaped roundups, sports, rumors, personalities without a mechanism, and topics already covered in the recent catalog. Favor a subject where the article can explain how something works, what changed, and the consequence. Do not invent URLs. Use exact URLs from the chosen cluster only.
  - role: user
    content: |-
      Recent catalog:
      {{recent}}

      Source-diverse story clusters:
      {{candidates}}

      Choose the strongest publishable cluster. Copy its useful source URLs into the matching primary and secondary arrays, and make the search query specific enough to retrieve the second primary record and additional independent reporting. Set publish=false when no cluster supports that path.
model: openai/gpt-4.1
modelParameters:
  maxCompletionTokens: 1800
  temperature: 0.1
responseFormat: json_schema
jsonSchema: |-
  {
    "name": "nightly_selection",
    "strict": true,
    "schema": {
      "type": "object",
      "properties": {
        "publish": {"type": "boolean"},
        "topic": {"type": "string"},
        "angle": {"type": "string"},
        "why_now": {"type": "string"},
        "query": {"type": "string"},
        "search_terms": {
          "type": "array",
          "items": {"type": "string"},
          "minItems": 1,
          "maxItems": 3
        },
        "selected_candidate_urls": {
          "type": "array",
          "items": {"type": "string"},
          "maxItems": 10
        },
        "primary_urls": {
          "type": "array",
          "items": {"type": "string"},
          "maxItems": 6
        },
        "secondary_urls": {
          "type": "array",
          "items": {"type": "string"},
          "maxItems": 8
        },
        "reason": {"type": "string"}
      },
      "required": [
        "publish",
        "topic",
        "angle",
        "why_now",
        "query",
        "search_terms",
        "selected_candidate_urls",
        "primary_urls",
        "secondary_urls",
        "reason"
      ],
      "additionalProperties": false
    }
  }
